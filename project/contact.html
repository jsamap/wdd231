<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Tail Trails is your go-to destination for outdoor adventures with dogs! Hike scenic paths, bike rugged terrain, and splash into lakes together. Unleash the fun!">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="stylesheet" href="styles/contact-large.css">
    <script src="scripts/date.mjs" type="module"></script>
    <script src="scripts/navigation.mjs" type="module"></script>
    <script src="scripts/contact.mjs" type="module"></script>

    <meta property="og:title" content="Tail Trails GT">
    <meta property="og:description" content="Tail Trails is your go-to destination for outdoor adventures with dogs! Hike scenic paths, bike rugged terrain, and splash into lakes together. Unleash the fun!">
    <meta property="og:url" content="https://jsamap.github.io/wdd231/project/index.html">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://jsamap.github.io/wdd231/project/images/logo-black.webp">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tail Trials GT">
</head>
<body>
    <header>
        <button type="button" id="menu"><span>Menu</span></button>
        <div class="header">
            <img src="images/logo-white.webp" alt="TT logo" loading="lazy">
            <h1>TAIL<br>TRAILS</h1>
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index" id="home">Home</a></li>
                <li><a href="trips" id="trips">Trips</a></li>
                <li><a href="contact" id="contact" class="active">Join Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="banner">
            <h2>Adventure is better with a furry friend</h2>
            <img src="images/k-beach-paws.webp" alt="Paws in sand" loading="lazy">
        </div>
        <div class="form">
            <h2>Join the pack today!</h2>
            <div class="form-mid">
                <form action="review.html" method="get">
                    <h3>Sign me up!</h3><br>
                    <label>First Name <br><input type="text" id="fname" name="fname" required></label>
                    <br><br>
                    <label>Last Name <br><input type="text" id="lname" name="lname" required></label>
                    <br><br>
                    <label>Email <br><input type="email" id="email" name="email" required></label>
                    <br><br>
                    <label>Phone <br><input type="tel" id="phone" name="phone" required></label>
                    <br><br>
                    <label>Dog Name <br><input type="text" id="dname" name="dname"></label>
                    <br><br>
                    <label class="italic"><input type="checkbox" id="accept" name="accept" value="yes" required> I accept to be contacted by using any of these methods.</label>
                    <br><br>
                    <div class="btn">
                        <input type="submit" id="send" value="SEND INFO">
                    </div>
                </form>
            </div>
        </div>
        <div class="why">
            <h2>Why join Tail Trails?</h2>
            <div>
                <div>
                    <img src="images/j-happy.webp" alt="Be happy" loading="lazy">
                    <h3>Be<br>Happy</h3>
                </div>
                <div>
                    <img src="images/j-friends.webp" alt="Make friends" loading="lazy">
                    <h3>Make<br>Friends</h3>
                </div>
                <div>
                    <img src="images/j-explore-2.webp" alt="Explore nature" loading="lazy">
                    <h3>Explore &<br>Connect</h3>
                </div>
                <div>
                    <img src="images/j-equipment.webp" alt="Get equipped" loading="lazy">
                    <h3>Get<br>Started</h3>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="social">
            <a href="https://github.com/jsamap"><img src="images/github.svg" alt="GitHub" loading="lazy"></a>
            <a href="https://www.linkedin.com/in/jaredsamayoa"><img src="images/linkedin.svg" alt="LinkedIn" loading="lazy"></a>
            <a href="http://wa.me/+50234000940"><img src="images/whatsapp.svg" alt="WhatsApp" loading="lazy"></a>
            <a href="https://www.xbox.com/en-us/play/user/HaloShot96"><img src="images/xbox.svg" alt="Xbox" loading="lazy"></a>
        </div>
        <p id="footer">&copy;<span id="currentYear"></span>&nbsp;&nbsp;&#129302;&nbsp;&nbsp;Jared
            Samayoa&nbsp;&nbsp;&#129302;&nbsp;&nbsp;Guatemala</p>
        <p class="lastModified"><span id="lastModified"></span></p>
    </footer>
</body>
</html>
